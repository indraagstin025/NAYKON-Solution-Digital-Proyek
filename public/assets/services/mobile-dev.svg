<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="nk-mobile-grad" x1="16" y1="8" x2="48" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00A3FF" />
      <stop offset="50%" stop-color="#0062FF" />
      <stop offset="100%" stop-color="#003BC2" />
    </linearGradient>
    <linearGradient id="nk-mobile-soft" x1="16" y1="8" x2="48" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00A3FF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0062FF" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="32" cy="32" r="24" fill="url(#nk-mobile-soft)" />

  <!-- Smartphone Outer Body -->
  <rect x="18" y="10" width="28" height="44" rx="8" fill="url(#nk-mobile-soft)" stroke="url(#nk-mobile-grad)" stroke-width="2.2" />

  <!-- Dynamic Island / Speaker Notch -->
  <rect x="27" y="14" width="10" height="2.5" rx="1.25" fill="url(#nk-mobile-grad)" />

  <!-- Mobile Screen Content: Top Hero Card -->
  <rect x="22" y="20" width="20" height="11" rx="3" fill="#FFFFFF" stroke="url(#nk-mobile-grad)" stroke-width="1.2" />
  <circle cx="27" cy="25" r="2" fill="#00A3FF" />
  <line x1="32" y1="24" x2="38" y2="24" stroke="#0062FF" stroke-width="1.2" stroke-linecap="round" />
  <line x1="32" y1="27" x2="36" y2="27" stroke="#00A3FF" stroke-width="1" stroke-linecap="round" />

  <!-- Mobile App Grid Items -->
  <rect x="22" y="34" width="9" height="9" rx="2.5" fill="#FFFFFF" stroke="url(#nk-mobile-grad)" stroke-width="1.2" />
  <rect x="33" y="34" width="9" height="9" rx="2.5" fill="url(#nk-mobile-grad)" />

  <!-- Bottom Home Gesture Indicator -->
  <line x1="28" y1="49.5" x2="36" y2="49.5" stroke="url(#nk-mobile-grad)" stroke-width="2" stroke-linecap="round" />

  <!-- Subtle Floating Mobile Sparkle/Connection Dot -->
  <circle cx="49" cy="18" r="2" fill="#00A3FF" />
  <circle cx="15" cy="44" r="1.5" fill="#0062FF" />
</svg>
